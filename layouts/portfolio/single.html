{{ define "main" }}
  {{ $css := resources.Get "css/portfolio-detail.css" | resources.Minify }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" />

  {{ if .Params.math }}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
      onload="renderMathInElement(document.body,{delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}]});"
    ></script>
  {{ end }}

  <div
    class="post {{ with .Site.Params.doNotLoadAnimations }}
      .
    {{ else }}
      animated fadeInDown
    {{ end }}"
  >
    <article class="pf-detail">
      <a class="pf-back-link" href="{{ "portfolio/" | relURL }}" aria-label="Back to Portfolio">
        <span aria-hidden="true">←</span> Back to Portfolio
      </a>
      <header class="pf-detail__header">
        <h1>{{ .Title }}</h1>
        {{ with .Params.credential }}<p class="pf-detail__credential">{{ . }}</p>{{ end }}
      </header>
      {{ .Content }}
    </article>
  </div>

  <div class="pf-lightbox" id="pf-lightbox" aria-hidden="true">
    <button class="pf-lightbox__close" type="button" aria-label="Close">&times;</button>
    <img src="" alt="" />
  </div>
  <script>
    (function () {
      var box = document.getElementById("pf-lightbox");
      if (!box) return;
      var full = box.querySelector("img");
      var closeBtn = box.querySelector(".pf-lightbox__close");

      function open(src, alt) {
        full.src = src;
        full.alt = alt || "";
        box.classList.add("is-open");
        box.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }
      function close() {
        box.classList.remove("is-open");
        box.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        full.src = "";
      }

      document.querySelectorAll(".pf-detail .pf-figure img").forEach(function (img) {
        img.addEventListener("click", function () {
          open(img.getAttribute("data-full") || img.currentSrc || img.src, img.alt);
        });
      });

      box.addEventListener("click", function (e) {
        if (e.target === box || e.target === closeBtn) close();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && box.classList.contains("is-open")) close();
      });
    })();
  </script>
{{ end }}
